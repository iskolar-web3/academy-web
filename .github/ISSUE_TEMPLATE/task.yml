name: Task
description: Plan a specific development, design, or maintenance task for the Academy web app.
title: "[Task]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task so a teammate can pick it up without asking. Keep the scope to one change; split bigger work into several tasks.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this touch?
      options:
        - Landing page
        - Sign-in & onboarding
        - Student projects & submission
        - Verification checks
        - Grants
        - Document vault
        - Discover & project pages
        - Sponsor deal flow, interest & watchlist
        - Subscription
        - Notifications
        - Admin console
        - Settings & profile
        - Layout & shared UI
        - Tooling, CI & docs
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: The problem this solves or the request behind it.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected Outcome
      description: What should exist or work once this is done? Mockups or screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How can we verify that this task is complete?
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server Work Needed?
      description: Does this need a new or changed academy-server endpoint?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: input
    id: traces
    attributes:
      label: Traces To
      description: Related user story or requirement IDs, if any.
      placeholder: e.g. STU-05, SPN-03, FR-G2
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Depends On
      description: Issues or PRs that must land first.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Relevant links, docs, or technical notes.
    validations:
      required: false
